[project]
name = "llm-cache"
version = "0.1.0"
description = "Lightweight semantic caching for LLM applications, backed by Redis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Mayur Adlak", email = "mayuradlak030@gmail.com" }]
maintainers = [{ name = "Mayur Adlak", email = "mayuradlak030@gmail.com" }]
keywords = [
    "llm",
    "cache",
    "semantic-cache",
    "redis",
    "embeddings",
    "vector-search",
    "sentence-transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
dependencies = [
    "redis>=5.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/Mayuradlak123/llm-cache"
Repository = "https://github.com/Mayuradlak123/llm-cache"
Documentation = "https://github.com/Mayuradlak123/llm-cache#readme"
"Bug Tracker" = "https://github.com/Mayuradlak123/llm-cache/issues"
Changelog = "https://github.com/Mayuradlak123/llm-cache/releases"

[project.scripts]
llm-cache = "llm_cache.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cache"]

# The sdist carries what a contributor needs to reproduce the build; the demo,
# the plan and the CI config are not part of the installable package.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/WORKFLOW.md",
    "/LICENSE",
    "/docker-compose.yml",
    "/docker-compose.ha.yml",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
