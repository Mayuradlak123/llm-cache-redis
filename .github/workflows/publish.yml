name: Publish to PyPI

# Publishing is triggered by cutting a GitHub Release, so the tag and the
# PyPI version always match something a human deliberately created.
#
# NOTE: a *draft* release does not fire this event. The release must be
# published for the workflow to run at all.
on:
  release:
    types: [published]
  workflow_dispatch:

# One job that builds and publishes, deliberately: splitting it means handing
# the distributions between jobs as artifacts, which is an extra failure
# surface for no benefit at this size.
jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-cache-redis
    permissions:
      id-token: write # Mandatory for Trusted Publishing
      contents: read # Declaring `permissions` sets everything else to none

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify the tag matches the package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag ($TAG) does not match pyproject version ($VERSION)" >&2
            exit 1
          fi
          echo "Publishing version $VERSION"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata renders on PyPI
        run: uv tool run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
