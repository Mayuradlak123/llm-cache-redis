name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & types (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package requires >=3.12; check every version it claims to support.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # A project venv, never `--system`: the runner's system Python is
      # externally managed (PEP 668) and refuses installs. `--clear` because
      # setup-uv may have already created .venv, and a restored cache can leave
      # a stale one behind.
      - name: Install the project
        run: |
          uv venv --clear
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy src

      - name: Verify the package imports
        run: uv run --no-sync python -c "import llm_cache; print(llm_cache.__version__)"

      - name: Verify the CLI entry point
        run: uv run --no-sync llm-cache --help

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      # `uv tool run` fetches twine into its own environment, so nothing is
      # installed into the runner's Python.
      - name: Check metadata renders on PyPI
        run: uv tool run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
