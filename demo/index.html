<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llm-cache demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
<div class="mx-auto max-w-5xl px-4 py-8 sm:py-12">

  <header class="mb-8">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">llm-cache</h1>
    <p class="mt-1 text-sm text-slate-600">
      Ask something, then ask it again in different words. The second one should never reach Groq.
    </p>
  </header>

  <!-- status strip -->
  <div id="status" class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>

  <div id="llm-warning" class="mb-6 hidden rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900"></div>

  <!-- ask box -->
  <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <label for="prompt" class="block text-sm font-medium text-slate-700">Prompt</label>
    <textarea id="prompt" rows="3"
      class="mt-2 w-full resize-y rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
      placeholder="What is Docker?"></textarea>

    <div class="mt-3 flex flex-wrap gap-2" id="suggestions"></div>

    <div class="mt-4 flex items-center gap-3">
      <button id="ask"
        class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700 disabled:opacity-40">
        Ask
      </button>
      <button id="clear"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100">
        Clear cache
      </button>
      <span id="spinner" class="hidden text-sm text-slate-500">thinking…</span>
    </div>
  </section>

  <!-- answer -->
  <section id="answer" class="mt-6 hidden rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-wrap items-center gap-3">
      <span id="verdict" class="rounded-full px-3 py-1 text-xs font-semibold"></span>
      <span id="metrics" class="text-xs text-slate-500"></span>
    </div>
    <p id="response" class="mt-4 whitespace-pre-wrap text-sm leading-relaxed text-slate-800"></p>
  </section>

  <!-- history -->
  <section class="mt-8">
    <h2 class="mb-3 text-sm font-semibold text-slate-700">History</h2>
    <div id="history" class="space-y-2">
      <p class="text-sm text-slate-400">Nothing asked yet.</p>
    </div>
  </section>

  <footer id="config" class="mt-10 border-t border-slate-200 pt-5 text-xs text-slate-500"></footer>
</div>

<script>
const SUGGESTIONS = [
  "What is Docker?",
  "Can you explain Docker?",
  "Explain Docker in simple words.",
  "How do I make cold brew coffee?",
];

const $ = (id) => document.getElementById(id);
let history = [];

function tile(label, value) {
  return `<div class="rounded-lg border border-slate-200 bg-white px-3 py-2">
    <div class="text-[11px] uppercase tracking-wide text-slate-500">${label}</div>
    <div class="mt-0.5 truncate text-sm font-semibold text-slate-900" title="${value}">${value}</div>
  </div>`;
}

async function refresh() {
  const state = await (await fetch("/api/state")).json();
  const s = state.stats;
  const hitRate = s.total_requests ? Math.round(s.hit_rate * 100) : 0;

  $("status").innerHTML = [
    tile("Requests", s.total_requests),
    tile("Cache hits", `${s.hits} (${hitRate}%)`),
    tile("LLM calls made", state.groq.llm_calls ?? 0),
    tile("Tokens used", state.groq.total_tokens ?? 0),
  ].join("");

  $("config").innerHTML =
    `store: <b>${state.backend}</b> &middot; llm: <b>${state.llm}</b> &middot; ` +
    `namespace: <b>${state.config.namespace}</b> &middot; threshold: <b>${state.config.similarity_threshold}</b> &middot; ` +
    `ttl: <b>${state.config.ttl ?? "no expiry"}</b> &middot; model: <b>${state.config.groq_model}</b>`;

  if (state.llm_error) {
    $("llm-warning").textContent = state.llm_error;
    $("llm-warning").classList.remove("hidden");
  }
}

function render(result) {
  $("answer").classList.remove("hidden");
  const hit = result.cache_hit;
  $("verdict").textContent = hit ? "CACHE HIT — no LLM call" : "CACHE MISS — called the LLM";
  $("verdict").className = "rounded-full px-3 py-1 text-xs font-semibold " +
    (hit ? "bg-emerald-100 text-emerald-800" : "bg-orange-100 text-orange-800");

  const sim = result.similarity === null ? "—" : result.similarity.toFixed(4);
  $("metrics").textContent =
    `similarity ${sim} (threshold ${result.threshold}) · ${result.latency_ms} ms`;
  $("response").textContent = result.response;

  history.unshift(result);
  $("history").innerHTML = history.map((r) => {
    const badge = r.cache_hit
      ? `<span class="shrink-0 rounded bg-emerald-100 px-2 py-0.5 text-[11px] font-semibold text-emerald-800">HIT</span>`
      : `<span class="shrink-0 rounded bg-orange-100 px-2 py-0.5 text-[11px] font-semibold text-orange-800">MISS</span>`;
    const sim = r.similarity === null ? "" : ` · sim ${r.similarity.toFixed(3)}`;
    return `<div class="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2">
      ${badge}
      <span class="min-w-0 flex-1 truncate text-sm text-slate-700">${r.prompt}</span>
      <span class="shrink-0 text-xs tabular-nums text-slate-500">${r.latency_ms} ms${sim}</span>
    </div>`;
  }).join("");
}

async function ask() {
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  $("ask").disabled = true;
  $("spinner").classList.remove("hidden");
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    const data = await res.json();
    if (!res.ok) {
      $("answer").classList.remove("hidden");
      $("verdict").textContent = "ERROR";
      $("verdict").className = "rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-800";
      $("metrics").textContent = "";
      $("response").textContent = data.error || "request failed";
      return;
    }
    render(data);
    await refresh();
  } finally {
    $("ask").disabled = false;
    $("spinner").classList.add("hidden");
  }
}

$("suggestions").innerHTML = SUGGESTIONS.map(
  (s) => `<button class="rounded-full border border-slate-300 px-3 py-1 text-xs text-slate-600 transition hover:bg-slate-100">${s}</button>`
).join("");
$("suggestions").addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") $("prompt").value = e.target.textContent;
});

$("ask").addEventListener("click", ask);
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask();
});
$("clear").addEventListener("click", async () => {
  await fetch("/api/clear", { method: "POST" });
  history = [];
  $("history").innerHTML = '<p class="text-sm text-slate-400">Cache cleared.</p>';
  $("answer").classList.add("hidden");
  await refresh();
});

refresh();
</script>
</body>
</html>
